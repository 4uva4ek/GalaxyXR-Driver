name: Build and release GalaxyXRDriver

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: galaxy-xr-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows-release:
    name: Windows x64 portable release
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: GalaxyXRDriverGUI/package-lock.json

      # Check the actual Git checkout, not just files left in a local ZIP extract.
      - name: Verify build helpers are present and tracked
        shell: pwsh
        run: |
          node .\tools\verify-build-sources.cjs --require-tracked
          if ($LASTEXITCODE -ne 0) { throw 'Build source checkout is incomplete; see missing/ignored file report above' }
          node --test .\tools\tests\build-sources.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Build-source tracking regressions failed' }

      # Restore native inputs before spending time on the GUI/Rust build. This
      # also handles ZIP/vendored checkouts whose submodule metadata was lost.
      - name: Test and restore pinned native dependencies
        shell: pwsh
        run: |
          node --test .\tools\tests\native-dependencies.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Native dependency bootstrap regressions failed' }
          node .\tools\prepare-native-dependencies.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Native dependency restoration failed; see the missing/conflicting files above' }
          node .\tools\prepare-native-dependencies.cjs --check
          if ($LASTEXITCODE -ne 0) { throw 'Native source preflight failed' }

      # Network-free tests of package selection, cache safety, and the real
      # PowerShell 5.1/7 downloader/archive interfaces. Hosted CI still uses
      # its installed MSBuild toolchain below, not the portable downloader.
      - name: Test portable dependency bootstrap
        shell: pwsh
        env:
          REQUIRE_PORTABLE_POWERSHELL_TESTS: '1'
        run: |
          node --test .\tools\tests\portable-toolchain.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Portable toolchain bootstrap regressions failed' }

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Test release-version validation and both PowerShell wrappers
        shell: pwsh
        env:
          REQUIRE_POWERSHELL_TESTS: '1'
        run: |
          node --test .\tools\tests\release-version.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Release version regressions failed' }

      - name: Verify release version
        id: version
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '' }
          $version = & .\tools\Verify-ReleaseVersion.ps1 -Tag $tag -PassThru
          "version=$version" >> $env:GITHUB_OUTPUT
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Install frontend dependencies
        working-directory: GalaxyXRDriverGUI
        shell: pwsh
        run: npm ci

      - name: Run frontend tests
        working-directory: GalaxyXRDriverGUI
        shell: pwsh
        run: npm test

      - name: Run service and packaging regressions
        shell: pwsh
        run: |
          node .\tools\Test-FluentFixes.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Service regressions failed' }
          node .\tools\Test-CompanionModes.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Picture mode regressions failed' }
          node .\tools\Test-AboutSetup.cjs
          if ($LASTEXITCODE -ne 0) { throw 'About/setup regressions failed' }
          node .\tools\Test-SectionCards.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Section card regressions failed' }
          node .\tools\Test-FluentBuildHooks.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Packaging regressions failed' }
          node .\tools\Test-SourceUpdate.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Source update regressions failed' }

      - name: Build Galaxy XR portable package
        shell: pwsh
        run: node .\build.js --vendor galaxyxr

      - name: Test native installation, cleanup, and runtime confirmation
        working-directory: GalaxyXRDriverGUI/src-tauri
        shell: pwsh
        run: cargo test --locked --lib

      - name: Create versioned ZIP, checksum, and release notes
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '' }
          .\tools\Package-GitHubRelease.ps1 `
            -Version '${{ steps.version.outputs.version }}' `
            -Commit $env:GITHUB_SHA `
            -Tag $tag

      - name: Upload portable ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          path: release/GalaxyXRDriver-v${{ steps.version.outputs.version }}-Windows-x64.zip
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload release metadata
        uses: actions/upload-artifact@v7
        with:
          name: GalaxyXRDriver-v${{ steps.version.outputs.version }}-release-metadata
          path: |
            release/GalaxyXRDriver-v${{ steps.version.outputs.version }}-Windows-x64.zip.sha256
            release/GalaxyXRDriver-v${{ steps.version.outputs.version }}-Windows-x64-release-notes.md
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' `
            'release/GalaxyXRDriver-v${{ steps.version.outputs.version }}-Windows-x64.zip' `
            'release/GalaxyXRDriver-v${{ steps.version.outputs.version }}-Windows-x64.zip.sha256' `
            --verify-tag `
            --title 'Galaxy XR Companion v${{ steps.version.outputs.version }}' `
            --notes-file 'release/GalaxyXRDriver-v${{ steps.version.outputs.version }}-Windows-x64-release-notes.md'

      - name: Upload native dependency diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-dependency-diagnostics-${{ github.run_id }}
          path: |
            build/native-dependencies/*-fetch.log
            build/native-dependencies/restoration-report.json
          if-no-files-found: ignore
          retention-days: 7
